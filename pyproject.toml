[project]
name = "frogue"
version = "0.1.0"
description = "A roguelike built on the Hive ECS runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "tiboitel", email = "jules.boitelle@gmail.com" }
]
dependencies = []

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src", "hive" = "vendor/hive" }

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
